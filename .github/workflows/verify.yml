name: Verify library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Inspect library and CLI without site packages
        run: |
          python -S scripts/check_library.py
          python -S scripts/aa.py --version
      - name: Run complete regression and actual SQLite rehearsal
        run: python -S -m unittest discover -s tests -v
      - name: Verify historical build council integrity
        run: python -S scripts/check_council.py G5
      - name: Confirm checks did not edit the checkout
        run: test -z "$(git status --porcelain)"
